trigger:
  - main

pr:
  - main

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: CI

    jobs:
      - job: ApplicationTests
        steps:
          - checkout: self
            displayName: Repo checkout

          - task: UseNode@1
            inputs:
              versionSource: "spec"
              version: "24.x"
            displayName: Configure Node.js

          - script: npm test
            displayName: Run tests
